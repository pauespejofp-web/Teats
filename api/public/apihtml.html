<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Usuarios</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="mb-4">Usuarios</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="usuarios-body">
        </tbody>
    </table>
</div>

<button class="botonanadir btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalAddUser">
Añadir usuario
</button>
<style>
  .botonanadir{
    margin-left: 120px;
  }
</style>

<div class="modal fade" id="modalAddUser" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title">Crear usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="add-form">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input id="add-nombre" type="text" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="add-email" type="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input id="add-password" type="password" class="form-control" required>
          </div>

          <div id="add-feedback" class="text-center small"></div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" form="add-form" class="btn btn-primary">Crear usuario</button>
      </div>

    </div>
  </div>
</div>


<div class="modal fade" id="editarModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editar-form">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" id="edit-nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="edit-email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Contraseña <small>(dejar vacío si no cambiar)</small></label>
                <input type="password" id="edit-password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- incluir script de cliente que realiza las peticiones y maneja el DOM -->
<script src="api.js"></script>

<!-- Script añadido: manejo simple del formulario de creación -->
<script>
(function(){
  var form = document.getElementById('add-form');
  var feedback = document.getElementById('add-feedback');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var nombre = document.getElementById('add-nombre').value.trim();
    var email = document.getElementById('add-email').value.trim();
    var password = document.getElementById('add-password').value;

    if (!nombre || !email || !password) {
      feedback.innerHTML = '<span class="text-danger small">Rellena todos los campos.</span>';
      return;
    }

    feedback.innerHTML = '<span class="text-muted small">Enviando…</span>';

    fetch('../api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: nombre, email: email, password: password })
    })
    .then(function(res){ return res.text().then(function(t){ return { ok: res.ok, text: t }; }); })
    .then(function(result){
      var json = null;
      try { json = JSON.parse(result.text); } catch(e){ /* ignore parse error */ }

      if (result.ok && (json === null || json.estado === 'Exito')) {
        feedback.innerHTML = '<span class="text-success small">Usuario creado.</span>';
        form.reset();
        if (window.cargarUsuarios) window.cargarUsuarios();
      } else {
        var msg = (json && json.data) ? json.data : 'Error al crear usuario';
        feedback.innerHTML = '<span class="text-danger small">' + msg + '</span>';
      }
      setTimeout(function(){ feedback.innerHTML = ''; }, 3000);
    })
    .catch(function(){
      feedback.innerHTML = '<span class="text-danger small">Error de red.</span>';
      setTimeout(function(){ feedback.innerHTML = ''; }, 3000);
    });
  });
})();
</script>

</body>
</html>
